<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>for my girl</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(92vw, calc((100dvh - clamp(88px,16vh,150px) - 40px)*.75), 62vh);aspect-ratio:3/4;flex-shrink:0;transform-origin:50% 97%}
  #wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #stage{position:relative;width:100%;height:100dvh;box-sizing:border-box;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #lyrics{height:clamp(88px,16vh,150px);width:min(92vw,680px);position:relative;display:flex;flex-direction:column;justify-content:center;text-align:center;font-family:"Georgia","Noto Serif",serif;overflow:visible;flex-shrink:0}
  .lyric{font-weight:400;font-size:clamp(20px,4vw,34px);line-height:1.28;color:#fff;transition:transform .45s,opacity .45s;letter-spacing:.005em;padding:3px 0}
  #prev,#next{opacity:.25;font-size:clamp(12px,2.4vw,18px);font-weight:400}
  #current{filter:drop-shadow(0 0 12px #f5a5c766)}
  .word{display:inline-block;color:#ffffff45;transition:color .22s,text-shadow .22s;white-space:pre}
  .word.done{color:#fff}.word.active{color:#ffd1e4;text-shadow:0 0 14px #f8a9cd90}
  @media(max-height:550px){#stage{gap:0}#lyrics{height:70px}#wrap{width:min(85vw,55vh)}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main id="stage"><div id="lyrics"><div class="lyric" id="prev"></div><div class="lyric" id="current"></div><div class="lyric" id="next"></div></div><div id="wrap">
  
  <canvas id="stars"></canvas>
  <canvas id="glow"></canvas>
  <canvas id="c"></canvas>
</div></main>

<audio id="song" preload="auto" autoplay loop playsinline></audio>
<script>
const W=600,H=800;
const CW=3, CH=4;               // дрібніші клітинки = більше «строк»
const GX=Math.floor(W/CW), GY=Math.floor(H/CH);
const OUT=2;
const T_END=6.5;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261125);
const rr=(a,b)=>a+(b-a)*R();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const easeOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const lerp=(a,b,t)=>a+(b-a)*t;
function easeBack(x){ x=clamp(x); const c1=1.25; return 1+(c1+1)*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }

const PAL={
  white:{ throat:'#d6e89f', a:'#fffefb', b:'#fbf2ea', tip:'#fffaf5',
          edge:'rgba(150,125,105,.78)', vein:'rgba(186,150,135,.42)', mid:'rgba(170,150,110,.52)',
          stripe:'rgba(250,198,215,.28)', spot:'#d88ea9', anther:'#c4651f' },
  blush:{ throat:'#dfe8a0', a:'#fff4f8', b:'#f8d3e0', tip:'#fee7ef',
          edge:'rgba(195,102,145,.75)', vein:'rgba(220,125,165,.45)', mid:'rgba(206,125,148,.5)',
          stripe:'rgba(248,164,195,.34)', spot:'#d4709b', anther:'#c4651f' },
  pink: { throat:'#e2e79f', a:'#fce0ea', b:'#efa3c0', tip:'#f9cfe0',
          edge:'rgba(182,76,124,.80)', vein:'rgba(228,102,158,.48)', mid:'rgba(205,96,135,.55)',
          stripe:'rgba(236,118,166,.46)', spot:'#c4508a', anther:'#b8561a' }
};

const FL=[
  {x: 70,y:215,L:36, tilt:.8, rot:0, pal:'blush',maxB:.10},
  {x:535,y:200,L:36, tilt:.8, rot:0, pal:'pink', maxB:.12},
  {x:305,y:46, L:34, tilt:.8, rot:0, pal:'white',maxB:.08},
  {x:225,y:125,L:68, tilt:.80,rot:-.40,pal:'blush'},
  {x:390,y:115,L:66, tilt:.85,rot: .50,pal:'white'},
  {x:100,y:300,L:62, tilt:.75,rot:-.90,pal:'pink' },
  {x:505,y:305,L:62, tilt:.78,rot: .90,pal:'white'},
  {x:165,y:235,L:86, tilt:.82,rot: .30,pal:'white'},
  {x:440,y:225,L:88, tilt:.80,rot:-.30,pal:'blush'},
  {x:305,y:245,L:108,tilt:.88,rot: .15,pal:'pink' },
  {x:150,y:420,L:84, tilt:.75,rot: .20,pal:'white'},
  {x:468,y:410,L:80, tilt:.78,rot:-.60,pal:'pink' },
  {x:225,y:385,L:108,tilt:.80,rot:-.20,pal:'pink' },
  {x:385,y:395,L:112,tilt:.85,rot: .45,pal:'white'},
  {x:300,y:530,L:100,tilt:.75,rot: .10,pal:'blush'},
];
const orderPerm=FL.map((_,i)=>i).sort(()=>R()-.5);
let TT=0;
const BASE_Y=785;
FL.forEach((f,i)=>{
  f.i=i;
  f.L*=1.12;
  f.order=orderPerm.indexOf(i);
  const bx=300+(i-7)*2.8;
  const p0=[bx,BASE_Y], p1=[bx+(f.x-bx)*.1, BASE_Y-(BASE_Y-f.y)*.4];
  const p2=[f.x-(f.x-300)*.25, f.y+(BASE_Y-f.y)*.35], p3=[f.x,f.y];
  f.stem=[];
  for(let k=0;k<=80;k++){
    const t=k/80,u=1-t;
    f.stem.push([
      u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],
      u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]
    ]);
  }
  f.dir=Math.atan2(p3[1]-p2[1], p3[0]-p2[0]);
  f.sw=rr(3.0,3.8);
  f.tepals=[]; const a0=rr(0,1);
  for(let k=0;k<6;k++){
    const inner=k%2===1;
    const spots=[]; const ns=inner?34:22;
    for(let q=0;q<ns;q++) spots.push({s:rr(.14,.66),v:rr(-.6,.6),r:rr(.8,2.1)});
    f.tepals.push({a:a0+k*Math.PI/3+rr(-.06,.06), inner, sc:rr(.94,1.08), pj:rr(-.09,.09),
      cm:rr(.8,1.25), wp:rr(0,6.3), wav:inner?rr(.05,.09):rr(.02,.04), spots});
  }
  f.stam=[];
  for(let k=0;k<6;k++) f.stam.push({a:k*Math.PI/3+rr(-.3,.3)+.35, ph:rr(.5,.9), len:rr(.5,.66), bend:rr(.05,.2)});
  f.pistil={a:rr(0,6.3), ph:.42, len:.82};
  f.leaves=[];
  const nl=2+(R()<.6?1:0);
  for(let k=0;k<nl;k++){
    const t=.2+k*.2+rr(0,.08);
    const idx=Math.floor(t*80);
    const [lx,ly]=f.stem[idx];
    const [nx,ny]=f.stem[idx+1];
    const ang=Math.atan2(ny-ly,nx-lx);
    const side=((i+k)%2?1:-1);
    const la=ang+side*rr(.6,1.0);
    f.leaves.push({x:lx,y:ly,a:la,L:rr(70,110)*(.75+.5*(1-t)),W:rr(11,17),
      bend:(Math.cos(la)<0?-1:1)*rr(.1,.3), t, start:.35+t*.6+i*.03, shade:R()});
  }
});
const BASAL=[];
for(let k=0;k<13;k++){
  const a=-Math.PI/2+(k/12-.5)*2.3+rr(-.1,.1);
  BASAL.push({x:300+rr(-16,16),y:rr(772,788),a,
    L:rr(60,85)+55*Math.abs(Math.cos(a)), W:rr(11,17),
    bend:(Math.cos(a)<0?-1:1)*rr(.12,.35), start:.45+R()*1.0, shade:R()});
}

const NPT=20;
const prof=s=>2.4*Math.pow(s,.55)*Math.pow(1-s,.7);
function drawTepal3D(c,p,it,T){
  const {tp,Lk,Wd,curl,el,ew,en,o}=it;
  const wid=s=>Wd*prof(s)*(1+tp.wav*Math.sin(s*10+tp.wp)*Math.sin(Math.PI*s));
  const P=(s,v)=>{ const bz=curl*Lk*s*s; return T(el[0]*s*Lk+ew[0]*v+en[0]*bz, el[1]*s*Lk+ew[1]*v+en[1]*bz, el[2]*s*Lk+ew[2]*v+en[2]*bz); };
  const top=[],bot=[],ctr=[];
  for(let i=0;i<=NPT;i++){ const s=i/NPT,w=wid(s); top.push(P(s,w)); bot.push(P(s,-w)); ctr.push(P(s,0)); }
  const path=()=>{ c.beginPath(); c.moveTo(top[0][0],top[0][1]); for(let i=1;i<=NPT;i++) c.lineTo(top[i][0],top[i][1]); for(let i=NPT;i>=0;i--) c.lineTo(bot[i][0],bot[i][1]); c.closePath(); };
  const b0=ctr[0],b1=ctr[NPT]; let dx=b1[0]-b0[0],dy=b1[1]-b0[1]; if(dx*dx+dy*dy<4){ dx+=.5; dy+=.5; }
  const g=c.createLinearGradient(b0[0],b0[1],b0[0]+dx,b0[1]+dy);
  g.addColorStop(0,p.throat); g.addColorStop(.16,p.a); g.addColorStop(.56,p.b); g.addColorStop(1,p.tip);
  c.fillStyle=g; path(); c.fill();
  c.save(); path(); c.clip();
  const green=(tp.inner?.25:.75)*Math.pow(1-clamp(o),1.3);
  if(green>.02){ c.globalAlpha=green; c.fillStyle='#8fcb6a'; path(); c.fill(); c.globalAlpha=1; }
  const line=(vf,col,lw,s0=.06,s1=.94)=>{ c.strokeStyle=col; c.lineWidth=lw; c.beginPath(); for(let i=0;i<=12;i++){ const s=s0+(s1-s0)*i/12,q=P(s,vf*wid(s)); i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]); } c.stroke(); };
  const sc=Lk/90;
  if(p.stripe){ c.lineCap='round'; line(0,p.stripe,Math.max(1.6,Wd*.44),.07,.9); }
  for(const vf of [-.82,-.68,-.54,-.4,-.24,.24,.4,.54,.68,.82]) line(vf,p.vein,Math.max(.8,sc*.95),.08,.92);
  for(const vf of [-.58,-.32,.32,.58]) line(vf,'rgba(255,255,255,.18)',Math.max(.7,sc*.8),.12,.86);
  line(.14,'rgba(255,255,255,.33)',Math.max(1,sc*1.2),.08,.9);
  line(-.14,'rgba(255,255,255,.33)',Math.max(1,sc*1.2),.08,.9);
  line(0,p.mid,Math.max(1.1,sc*1.7),.04,.97);
  c.fillStyle=p.spot; c.globalAlpha=.68;
  for(const sp of tp.spots){ const q=P(sp.s,sp.v*wid(sp.s)); c.beginPath(); c.arc(q[0],q[1],sp.r*(sc+.35),0,6.3); c.fill(); }
  c.globalAlpha=.14; c.fillStyle='#fff';
  for(let h=0; h<3; h++){ const s=.24+h*.17 + .015*Math.sin(TT*1.3+h+it.z*.03); const q=P(s,.08*wid(s)); c.beginPath(); c.ellipse(q[0],q[1],Math.max(1,sc*3.2),Math.max(.7,sc*1.1),0,0,6.3); c.fill(); }
  c.globalAlpha=1;
  const n=T(en[0],en[1],en[2]), nz=n[2], lum=n[0]*-.25+n[1]*-.45+nz*.85;
  if(lum<.4){ c.globalAlpha=(.4-lum)*.32; c.fillStyle='#2a1020'; path(); c.fill(); }
  else if(lum>.8){ c.globalAlpha=(lum-.8)*.5; c.fillStyle='#fff'; path(); c.fill(); }
  if(nz<-.05){ c.globalAlpha=.18; c.fillStyle='#8bbd6a'; path(); c.fill(); }
  c.globalAlpha=1;
  c.restore();
  c.strokeStyle=p.edge; c.lineWidth=Math.max(1.1,sc*2.05); c.lineJoin='round'; path(); c.stroke();
}

function drawFlower(c,f,g,b){
  const p=PAL[f.pal], eb=ease(b);
  const S=f.L*lerp(.10+.52*g,1,eb)*(1+.013*Math.sin(TT*1.05+f.i*.9));
  const psiF=Math.acos(clamp(f.tilt+Math.sin(TT*.85+f.i)*.018,0,1));
  const k=ease(clamp(b*2.6));
  const psi=lerp(Math.PI/2,psiF,k);
  const rb=f.dir+Math.PI/2, rf=f.rot+Math.sin(TT*.9+f.i*1.7)*.014;
  let dr=rf-rb; dr=Math.atan2(Math.sin(dr),Math.cos(dr));
  const rot=rb+dr*k;
  const cp=Math.cos(psi), sp=Math.sin(psi), cr=Math.cos(rot), sr=Math.sin(rot);
  const T=(x,y,z)=>{ const y1=y*cp-z*sp, z1=y*sp+z*cp; return [x*cr-y1*sr, x*sr+y1*cr, z1]; };
  const bloomBob=Math.sin(TT*1.08+f.i*.82)*0.85*eb + Math.sin(TT*2.1+f.i*.37)*0.25*eb;
  const bloomRot=(Math.sin(TT*.92+f.i*.73)*0.012 + Math.sin(TT*1.63+f.i)*0.005)*eb;
  const bloomScale=1 + Math.sin(TT*1.22+f.i*.5)*0.006*eb;
  c.save(); c.translate(f.x,f.y+bloomBob); c.rotate(bloomRot); c.scale(bloomScale,bloomScale);
  const items=[];
  for(const tp of f.tepals){
    const delay=tp.inner?.18:0;
    const o=clamp((b-delay)/(1-delay));
    const ob=easeBack(o);
    const phiOpen=(tp.inner?1.5:1.75)+tp.pj;
    let phi=lerp(tp.inner?.08:.13,phiOpen,ob)+.022*Math.sin(TT*1.05+f.i+tp.a*2)*eb;
    const Lk=S*tp.sc*(tp.inner?.96:1), Wd=Lk*(tp.inner?.34:.24)*(.85+.15*o), curl=lerp(.1,-.34*tp.cm,ob);
    const sa=Math.sin(tp.a), ca=Math.cos(tp.a), sphi=Math.sin(phi), cphi=Math.cos(phi);
    const el=[ca*sphi,sa*sphi,cphi], ew=[-sa,ca,0];
    const en=[el[1]*ew[2]-el[2]*ew[1], el[2]*ew[0]-el[0]*ew[2], el[0]*ew[1]-el[1]*ew[0]];
    const tip=T(el[0]*Lk,el[1]*Lk,el[2]*Lk);
    items.push({tp,Lk,Wd,curl,el,ew,en,o,z:tip[2]});
  }
  items.sort((a,b2)=>a.z-b2.z);
  for(const it of items) drawTepal3D(c,p,it,T);
  const so=clamp((b-.48)/.42);
  if(so>0){
    c.lineCap='round';
    const Q=(dir,len,bend)=>{ const e=[dir[0]*len,dir[1]*len,dir[2]*len]; const m=[e[0]*.5,e[1]*.5,e[2]*.5+bend*len*.5]; return [T(m[0],m[1],m[2]),T(e[0],e[1],e[2])]; };
    for(const st of f.stam){
      const ph=st.ph, dir=[Math.cos(st.a)*Math.sin(ph),Math.sin(st.a)*Math.sin(ph),Math.cos(ph)];
      const [m,e]=Q(dir,S*st.len*so,st.bend);
      c.strokeStyle='#ece6bd'; c.lineWidth=Math.max(1.2,S*.02);
      c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(m[0],m[1],e[0],e[1]); c.stroke();
      const ang=Math.atan2(e[1]-m[1],e[0]-m[0]);
      c.save(); c.translate(e[0],e[1]); c.rotate(ang);
      const al=S*.085, aw=S*.028;
      c.fillStyle=p.anther; c.beginPath(); c.ellipse(0,0,al,aw,0,0,6.3); c.fill();
      c.fillStyle='rgba(255,205,120,.75)'; c.beginPath(); c.ellipse(-al*.15,-aw*.35,al*.6,aw*.35,0,0,6.3); c.fill();
      c.restore();
    }
    const pl=f.pistil,pd=[Math.cos(pl.a)*Math.sin(pl.ph),Math.sin(pl.a)*Math.sin(pl.ph),Math.cos(pl.ph)];
    const [pm,pe]=Q(pd,S*pl.len*so,.1);
    c.strokeStyle='#f5efcb'; c.lineWidth=Math.max(1.5,S*.028);
    c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(pm[0],pm[1],pe[0],pe[1]); c.stroke();
    c.fillStyle='#f4a9c6'; c.beginPath(); c.arc(pe[0],pe[1],Math.max(2,S*.04),0,6.3); c.fill();
  }
  c.restore();
}

function drawStem(c,f,p){
  const n=Math.floor(p*80); if(n<1) return;
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle='#2f8a22'; c.lineWidth=f.sw;
  c.beginPath(); c.moveTo(f.stem[0][0],f.stem[0][1]); for(let k=1;k<=n;k++) c.lineTo(f.stem[k][0],f.stem[k][1]); c.stroke();
  c.strokeStyle='#86dc50'; c.lineWidth=f.sw*.42;
  c.beginPath(); c.moveTo(f.stem[0][0]-.6,f.stem[0][1]); for(let k=1;k<=n;k++) c.lineTo(f.stem[k][0]-.6,f.stem[k][1]); c.stroke();
}
function drawLeaf(c,l,g){
  if(g<=0) return; const L=l.L*g,Wd=l.W*(.4+.6*g);
  const flutter=(Math.sin(TT*1.15+l.x*.055+l.y*.012)*.03 + Math.sin(TT*2.35+l.x*.021+l.a*3)*.012)*(0.55+.45*g);
  const bob=Math.sin(TT*1.05+l.x*.028+l.y*.01)*0.65*(0.45+.55*g);
  c.save(); c.translate(l.x,l.y+bob); c.rotate(l.a+flutter);
  const N=18, top=[], bot=[];
  for(let i=0;i<=N;i++){ const s=i/N,cx=s*L,cy=l.bend*L*s*s,w=Wd*Math.sin(Math.PI*Math.pow(s,.75))*(1-.2*s); top.push([cx,cy-w]); bot.push([cx,cy+w]); }
  const gr=c.createLinearGradient(0,0,L,0);
  gr.addColorStop(0,'#2a7a1e'); gr.addColorStop(.5,l.shade<.5?'#74cc46':'#5fbf3a'); gr.addColorStop(1,'#a6ec78');
  c.fillStyle=gr; c.beginPath(); c.moveTo(top[0][0],top[0][1]); for(const q of top) c.lineTo(q[0],q[1]); for(let i=N;i>=0;i--) c.lineTo(bot[i][0],bot[i][1]); c.closePath(); c.fill();
  c.globalAlpha=.16 + .06*Math.sin(TT*1.8+l.x*.02); c.fillStyle='#d6ffb0'; c.beginPath();
  for(let i=0;i<=N;i++){ const s=i/N, cx=s*L*.92, cy=l.bend*L*s*s - Math.sin(s*Math.PI)*Wd*.11; i?c.lineTo(cx,cy):c.moveTo(cx,cy); }
  for(let i=N;i>=0;i--){ const s=i/N, cx=s*L*.92, cy=l.bend*L*s*s + Math.sin(s*Math.PI)*Wd*.03; c.lineTo(cx,cy); }
  c.closePath(); c.fill(); c.globalAlpha=1;
  c.strokeStyle='rgba(210,255,160,.68)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(0,0); for(let i=1;i<=N;i++) c.lineTo(i/N*L,l.bend*L*(i/N)*(i/N)); c.stroke();
  c.restore();
}

const scene=document.createElement('canvas'); scene.width=W; scene.height=H;
const sc=scene.getContext('2d');
function renderScene(t,tt){
  sc.setTransform(1,0,0,1,0,0);
  sc.clearRect(0,0,W,H);
  // Transparent scene: no dark rectangle in the glow layer.
  const sway=(Math.sin(tt*.85)*.006+Math.sin(tt*.43)*.003)*clamp(tt/2.3);
  sc.translate(300,BASE_Y); sc.rotate(sway); sc.translate(-300,-BASE_Y);
  for(const f of FL) drawStem(sc,f,ease((t-f.i*.035)/.95));
  for(const f of FL) for(const l of f.leaves) drawLeaf(sc,l,easeOut((t-l.start)/.9));
  for(const f of FL){
    const budG=ease((t-(.75+f.i*.03))/.85);
    let b=clamp((t-(1.45+f.order*.10))/2.35);
    if(f.maxB!==undefined) b=Math.min(b,f.maxB);
    if(budG>.02) drawFlower(sc,f,budG,b);
  }
  for(const l of BASAL) drawLeaf(sc,l,easeOut((t-l.start)/1.0));
}

const bg=document.getElementById('bg'); bg.width=innerWidth*OUT; bg.height=innerHeight*OUT; addEventListener("resize",()=>{bg.width=innerWidth*OUT;bg.height=innerHeight*OUT}); const bctx=bg.getContext('2d');
const BG_ORBS=[]; for(let i=0;i<7;i++) BG_ORBS.push({x:rr(.12,.88)*W,y:rr(.08,.9)*H,r:rr(95,180),dx:rr(-10,10),dy:rr(-8,8),ph:R()*6.3,hue:R()<.5?330:350});
const FLOATERS=[]; for(let i=0;i<26;i++) FLOATERS.push({x:R()*W,y:R()*H,r:rr(1.5,4.5),sp:rr(7,18),dx:rr(-4,4),ph:R()*6.3,a:rr(.08,.24),warm:R()<.65});
function drawBackground(t){
  const g=bctx.createLinearGradient(0,0,0,bg.height);
  g.addColorStop(0,'#030204'); g.addColorStop(.38,'#08040a'); g.addColorStop(1,'#020103');
  bctx.clearRect(0,0,bg.width,bg.height);
  bctx.fillStyle=g; bctx.fillRect(0,0,bg.width,bg.height);
  bctx.save();
  for(const o of BG_ORBS){
    const x=(o.x + Math.sin(t*.18+o.ph)*o.dx)/W*bg.width, y=(o.y + Math.cos(t*.22+o.ph)*o.dy)/H*bg.height, r=o.r/W*Math.min(bg.width,bg.height)*(1+.08*Math.sin(t*.35+o.ph));
    const rg=bctx.createRadialGradient(x,y,0,x,y,r);

  const d=gc.getImageData(0,0,GX,GY).data;
  dst.fill(0);

  for(let y=0;y<GY;y++){
    const shift=(phaseCell[y]+Math.floor(tt*speedCell[y]*8)+LEN*1000)%LEN;
    const rowGlow=.97+.08*Math.sin(tt*.7+y*.055+pulseRow[y]);
    const lineAlt=(y&1)?1.03:.97;
    for(let x=0;x<GX;x++){
      const i=(y*GX+x)*4;
      const coverage=d[i+3]/255;
      let r=d[i]*coverage,g=d[i+1]*coverage,b=d[i+2]*coverage;
      const lum=(r+g+b)/3;

      const charIdx=bits[y*LEN+((x+shift)%LEN)];
      const revealBoost = clamp((t*1.2 - y/GY*1.1),0,1);
      const petalPulse = 1 + 0.09*Math.sin(tt*1.6 + x*.08 + y*.03);
      const light=(0.92 + 0.12*Math.sin((x*.06)-(tt*.85)+y*.025))*rowGlow*lineAlt*rowJitter[y];

        for(let px=0;px<cellW;px++){
          const ga=glyph[(py*atlas.width + charIdx*cellW + px)*4 + 3]/255;
          const alpha = dim + ga*(0.88 + 0.12*petalPulse);
          const k = Math.min(1.65, base*alpha);

          dst[z]   = Math.min(255, r*k);
          dst[z+1] = Math.min(255, g*k);
          dst[z+2] = Math.min(255, b*k);
          dst[z+3] = Math.min(255, (185 + ga*70)*coverage);
        }
      }

}

function startAutomatically(){song.play().then(()=>{awaitingAutoplay=false;running=true}).catch(()=>{});}

const fixed = new URLSearchParams(location.search).get('t');
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!hasAudio)demoTime=(demoTime+dt)%demoDuration;
  const duration=hasAudio&&Number.isFinite(song.duration)&&song.duration>0?song.duration:demoDuration;
  const tt=fixed!==null?parseFloat(fixed):hasAudio?song.currentTime:demoTime;

  wrap.style.transform=`rotate(${(Math.sin(tt*.95)*1.65+Math.sin(tt*.43)*.65)*clamp(tt/2)}deg) translateX(${Math.sin(tt*.75)*2.5}px)`;

}
